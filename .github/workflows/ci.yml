name: Smart Energy CI/CD Pipeline

on:
  push:
    branches:
      - main
      - pre-main
  pull_request:
    branches:
      - main
      - pre-main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Code Quality & Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate File Integrity
        run: |
          echo "Verifying project structure..."
          test -f app.py || exit 1
          test -f run.bat || exit 1
          test -f templates/index.html || exit 1
          test -f static/css/style.css || exit 1
          test -f static/js/app.js || exit 1
          test -f static/js/services/calculationService.js || exit 1
          test -f static/js/services/analyticsService.js || exit 1
          test -f static/js/services/storageService.js || exit 1
          echo "All core files are present and verified."

      - name: Run Backend Unit Tests
        run: |
          python -m unittest discover -s tests -v

  deploy:
    name: Deploy Static Preview to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
